name: Temperature Converter CI/CD 

on:
  push:
    branches:  
      - "Temperature-Converter"
  pull_request:
    branches:
      - "Temperature-Converter" 

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: Build WPF application
        run: ./Temperature_Converter/build.ps1
        working-directory: ./

      - name: Verify output directory
        run: ls ./Temperature_Converter/output

      - name: Upload build artifacts 
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./Temperature_Converter/output
          
      - name: Notify Success
        if: success()
        run: |
        $payload = '{"text": "✅ Build succeeded!"}'
         Invoke-RestMethod -Uri "${{ secrets.WEBHOOK_GITHUB_SLACK }}" -Method Post -Body $payload -ContentType 'application/json'

      - name: Notify Failure
        if: failure()
        run: |
        $payload = '{"text": "❌ Build failed!"}'
        Invoke-RestMethod -Uri "${{ secrets.WEBHOOK_GITHUB_SLACK }}" -Method Post -Body $payload -ContentType 'application/json'
     
      - name: Send Slack Notification
        run: |
          try {
              $branch = $env:GITHUB_REF
              $commit = $env:GITHUB_SHA
              $payload = '{"text": "✅ Build completed for branch: ' + $branch + ' \n Commit: ' + $commit + '"}'
              Invoke-RestMethod -Uri "${{ secrets.WEBHOOK_GITHUB_SLACK }}" -Method Post -Body $payload -ContentType 'application/json'
              } catch {
              $errorPayload = '{"text": "❌ Slack notification failed: ' + $_ + '"}'
              Invoke-RestMethod -Uri "${{ secrets.WEBHOOK_GITHUB_SLACK }}" -Method Post -Body $errorPayload -ContentType 'application/json'
              }
        shell: pwsh
      
  test:
   needs: build
   runs-on: windows-latest

   steps:
    - uses: actions/checkout@v2
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: ./Temperature_Converter/output


    - name: Run tests
      run: ./Temperature_Converter_UnitTest/UnitTest.ps1

    - name: List TestResults directory
      run: ls ./Temperature_Converter_UnitTest/TestResults

    - name: Upload unit test results 
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: ./Temperature_Converter_UnitTest/TestResults/junit-unit-test-results.xml
        if-no-files-found: warn
  deploy:
    needs:
      - build
      - test 
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@v2
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ github.workspace }}/output
      - name: Deploy WPF application
        run: |
          # Add your deployment commands here
