name: WPF Build

on:
  push:
    branches:
      - "Temperature-Converter"
  pull_request:
    branches:
      - "Temperature-Converter"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: Build WPF application
        run: pwsh ./TemperatureConverter/Temperature_Converter/build.ps1
        working-directory: ./

      - name: Verify output directory
        run: ls ./output

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./output

  test:
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./output
      - name: Run tests
        run: dotnet test ./Temperature_Converter_UnitTest/Temperature_Converter_UnitTest.csproj

  deploy:
    needs:
      - build
      - test
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@v2
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ github.workspace }}/output
      - name: Deploy WPF application
        run: |
          # Add your deployment commands here
