name: Temperature Converter CI/CD 

on:
  push:
    branches:  
      - "Temperature-Converter"
  pull_request:
    branches:
      - "Temperature-Converter" 

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: Build WPF application
        run: ./Temperature_Converter/build.ps1
        working-directory: ./

      - name: Verify output directory
        run: ls ./Temperature_Converter/output

      - name: Upload build artifacts 
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./Temperature_Converter/output

     
      - name: Send Slack Notification
        run: |
              $payload = '{"text": "Hello, Slack!"}'
               Invoke-RestMethod -Uri "${{ secrets.WEBHOOK_GITHUB_SLACK }}" -Method Post -Body $payload -ContentType 'application/json'
        shell: pwsh
      
  test:
   needs: build
   runs-on: windows-latest

   steps:
    - uses: actions/checkout@v2
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: ./Temperature_Converter/output


    - name: Run tests
      run: ./Temperature_Converter_UnitTest/UnitTest.ps1

    - name: List TestResults directory
      run: ls ./Temperature_Converter_UnitTest/TestResults

    - name: Upload unit test results 
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: ./Temperature_Converter_UnitTest/TestResults/junit-unit-test-results.xml
        if-no-files-found: warn
  deploy:
    needs:
      - build
      - test 
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@v2
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ github.workspace }}/output
      - name: Deploy WPF application
        run: |
          # Add your deployment commands here
