name: Temperature Converter CI/CD

on:
  push:
    branches:
      - "Temperature-Converter"
  pull_request:
    branches:
      - "Temperature-Converter"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build WPF application
        run: ./Temperature_Converter/build.ps1
        working-directory: ./
      - name: Verify output directory
        run: ls ./Temperature_Converter/output
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./Temperature_Converter/output

  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./build-artifacts
      - name: Restore packages
        run: dotnet restore ./Temperature_Converter/Temperature_Converter.csproj
        working-directory: ./
      - name: Run unit tests and generate JUnit XML report
        run: |
          $test_results_dir = Join-Path -Path "${{ github.workspace }}" -ChildPath "TestResults"
           New-Item -ItemType Directory -Path $test_results_dir -Force | Out-Null
          echo "::set-env name=JUNIT_XML_PATH::$test_results_dir\\junit-unit-test-results.xml"
          dotnet test ./Temperature_Converter/Temperature_Converter.csproj --test-adapter-path:. --logger:"junit;LogFilePath=${{ env.JUNIT_XML_PATH }}"
        working-directory: ./
        shell: pwsh
      - name: List TestResults directory
        run: ls ./TestResults
        working-directory: ./
      - name: List working directory
        run: ls ./
        working-directory: ./
      - name: List Temperature_Converter directory
        run: ls ./Temperature_Converter
        working-directory: ./
      - name: List current directory
        run: ls
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          if-no-files-found: warn
          compression-level: 6
          overwrite: false
          include-hidden-files: false
          path: TestResults/junit-unit-test-results.xml

