name: WPF Build

on:
  push:
    branches:
      - "Temperature-Converter"
  pull_request:
    branches:
      - "Temperature-Converter"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: Build WPF application
        run: ./Temperature_Converter/build.ps1
        working-directory: ./

      - name: Verify output directory
        run: ls ./Temperature_Converter/output

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./Temperature_Converter/output

  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./output
      - name: Restore packages
        run: dotnet restore ./Temperature_Converter_UnitTest/Temperature_Converter_UnitTest.csproj
        working-directory: ./
      - name: Run E2E tests
        run: dotnet test ./Temperature_Converter_UnitTest/Temperature_Converter_UnitTest.csproj --test-adapter-path:. --logger:"junit;LogFilePath=E2ETestResults.xml" --filter TestName~TestMethod
        working-directory: ./
      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: ./E2ETestResults.xml
   
  deploy:
    needs:
      - build
      - test
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@v2
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ github.workspace }}/output
      - name: Deploy WPF application
        run: |
          # Add your deployment commands here
